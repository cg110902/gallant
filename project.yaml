# Novel Factory 生产项目主配置文件 (Project Master Configuration)
# 一切题材、战力、文风、质检与模型均通过声明式挂载，严禁代码硬编码

project_name: "CYBER_NIGHT_2088"
project_title: "霓虹雨夜：断线黑客的复仇纪元"
version: "1.0.0"

# 1. 题材与法则体系配置挂载
genre:
  config_path: "configs/genres/cyberpunk_scifi.yaml"
  # 支持切换为: "configs/genres/xianxia_cultivation.yaml" 或 "configs/genres/suspense_mystery.yaml"

# 2. 叙事节奏与心跳节拍配置挂载
pacing:
  config_path: "configs/pacing/webnovel_high_octane.yaml"
  # 支持切换为: "configs/pacing/classic_three_act.yaml"

# 3. 机械质检与 Anti-Slop 规则包挂载
qc_pipeline:
  rule_packs:
    - "configs/rules/anti_slop.yaml"
    - "configs/rules/formatting.yaml"
  repetition_rules: "configs/rules/repetition.yaml"
  compliance_pack: "configs/rules/compliance.yaml"   # 过审风控词库
  auto_patch_on_failure: true
  max_local_patch_retries: 3

# 3.5 节拍契约交付审计（字数 SLA / 微事件 / 机位 / 在场纪律）
contract_audit:
  enforce_word_count: true
  enforce_micro_events: true
  enforce_camera_coverage: true
  min_camera_coverage_ratio: 0.5
  micro_event_high_confidence: 0.6      # 高于此视为已推进
  micro_event_low_confidence: 0.3       # 低于此判致命违约，中间地带交语义裁判

# 3.6 长程治理闸门（伏笔超期 / 时间线矛盾 / 人设崩坏 / 章末钩子失效）
governance:
  enforce: true                          # 治理问题是否否决整章
  strict_unregistered_entities: true     # 未注册角色出场即违规（防绕过不变量）
  max_simhash_incidents_per_chapter: 0   # 跨章雷同容忍上限
  foreshadow_due_soon_window: 10         # 距回收截止多少章开始催收
  hook_min_acceptable_score: 5.0         # 章末钩子合格线

# 3.65 大模型网关：节拍级重试与熔断
# 只在章级重试是不够的——一次瞬时 429 会导致整章重产，已写好的节拍要重新付费。
llm_gateway:
  max_retries: 3
  retry_base_delay: 1.0
  circuit_failure_threshold: 4
  circuit_recovery_timeout: 30.0

# 3.66 人机协同断点：机器修不动时交还给人，而不是硬产
hitl:
  enable: true
  patch_exhaustion_threshold: 3        # 节拍用尽几次补丁仍不过就挂起
  state_file: ".hitl_state.json"

# 3.7 断点续产运行时
runtime:
  journal_path: ".production_journal.json"
  max_attempts_per_chapter: 3
  retry_backoff_seconds: 2.0
  suspend_on_qc_failure: false           # 质检驳回是否挂起等待人工
  stop_on_financial_breaker: true

# 3.8 全书大纲（主线/分卷/章节/演员表）
outline:
  file: "outline.yaml"
  require_for_production: true           # 未规划的章节拒绝生产，避免污染版本库

# 4. 模型路由与 Prompt 缓存策略
models:
  director_agent: "gemini-3.1-pro-preview"    # 顶尖推理模型：负责细纲契约拆解与逻辑可达性 (Thinking Enabled)
  writer_agent: "gemini-3.8-flash"            # 高吞吐高性价比模型：负责单节拍正文渲染 (1M Context, Zero Latency)
  judge_agent: "gemini-3.5-flash-lite"        # 裁判模型：负责语义Post-conditions断言 (Ultra-fast Boolean Verification)
  enable_prompt_caching: true                 # 开启常驻Codex上下文缓存（单章成本骤降75%）
