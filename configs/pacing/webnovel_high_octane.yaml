# 商业网文快节奏心跳模型 (番茄/起点黄金三章与卡点流)
pacing_model: "WEBNOVEL_HIGH_OCTANE"
name: "商业网文多巴胺高压释放模型"

chapter_target_words: 2500
beats_per_chapter: 4

beat_templates:
  - beat_index: 1
    type: "BUILD_UP"
    weight_words: 600
    description: "危机降临/施压憋屈。对手挑衅或现实困境压迫，情绪张力持续走高"
    required_cameras: ["POV", "CLOSE_UP"]
    
  - beat_index: 2
    type: "COGNITIVE_GAP"
    weight_words: 650
    description: "认知差放大。对手底牌尽出自以为胜券在握，主角暗中完成反制布局"
    required_cameras: ["CLOSE_UP", "PANORAMIC"]
    
  - beat_index: 3
    type: "CATHARSIS_PAYOFF"
    weight_words: 750
    description: "高潮反杀与社会性震惊。极致爆发，紧跟围观者反应机位（Reaction Cam）"
    required_cameras: ["POV", "REACTION_CAM"]
    
  - beat_index: 4
    type: "CLIFFHANGER_HOOK"
    weight_words: 500
    description: "战利品盘点与下一重致命危机露头。在悬念最高点切断，诱导点击下一章"
    required_cameras: ["POV", "PANORAMIC"]
