[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-factory"
version = "0.1.0"
description = "Industrial-grade Universal Novel Production Pipeline - Data & Configuration Driven"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jieba>=0.42.1",
    "networkx>=3.0",
    "rich>=13.0.0",
    "rapidfuzz>=3.0.0",
    "httpx>=0.27.0",
    "google-genai>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
novel-factory = "src.novel_factory.cli.main:main"

# 全代码库统一使用 `src.novel_factory.*` 绝对导入，因此必须以仓库根为包根，
# 否则安装后导入路径与源码不一致，装完即崩。
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
